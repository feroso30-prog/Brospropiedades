# ============================================================================
# Configuración de Netlify para BROS PROPIEDADES
# Le dice a Netlify dónde está la función que hace de puente con KiteProp.
# ============================================================================

[build]
publish = "." # tu sitio está en la raíz del repositorio
functions = "netlify/functions" # aquí vive la función propiedades.js

# Ruta amistosa: /api/propiedades -> la función real
[[redirects]]
from = "/api/propiedades"
to = "/.netlify/functions/propiedades"
status = 200

# Accesos directos de WhatsApp (301 permanente)
[[redirects]]
from = "/whatsapp"
to = "https://wa.me/56934832370?text=Hola,%20quiero%20vender%20mi%20propiedad"
status = 301
force = true

[[redirects]]
from = "/whatsapp-arriendo"
to = "https://wa.me/56934832370?text=Hola,%20quiero%20arrendar%20mi%20propiedad."
status = 301
force = true

[functions]
node_bundler = "esbuild"
external_node_modules = ["@netlify/blobs"]

# Monitor de salud: se ejecuta cada hora en punto
[functions."monitor"]
schedule = "0 * * * *"

# Reportes de metricas: revisa a diario y envia el semanal (lunes) y mensual (dia 1)
[functions."reportes"]
schedule = "0 13 * * *"

[[redirects]]
  from = "/propiedad/*"
  to = "/.netlify/functions/propiedad/:splat"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
